[tool.poetry]
name = "paraxcel"
version = "0.1.0"
description = "A DOCX to Excel converter for question papers."
authors = ["mrxsierra <sunilsharma9@outlook.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.8,<4.0"
docx = "0.2.4"
et-xmlfile = "1.1.0"
lxml = "5.3.0"
numpy = "1.24.4"
openpyxl = "3.0.7"
pandas = "1.3.0"
pillow = "10.4.0"
python-dateutil = "2.9.0.post0"
pytz = "2024.2"
six = "1.16.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
