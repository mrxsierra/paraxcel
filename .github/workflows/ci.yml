name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.1'

    - name: Upgrade pip, setuptools, and wheel
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade setuptools wheel

    - name: Install dependencies
      run: |
        pip install python-docx pydantic pandas openpyxl pytest pytest-cov

    - name: Run tests
      run: |
        pytest tests --cov=src

    - name: Security check
      run: |
        pip install bandit
        bandit -r src

  build-executable:
    runs-on: windows-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.1'

    - name: Upgrade pip, setuptools, and wheel
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade setuptools wheel build

    - name: Install dependencies
      run: |
        pip install pyinstaller python-docx pydantic pandas openpyxl


    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --icon=src/assets/icon.ico --name=paraxcel src/app.py --add-data "src/assets/icon.ico;assets" --hidden-import=docx --hidden-import=openpyxl.cell._writer


    - name: List contents of dist directory
      run: dir dist

    - name: Check for paraxcel.exe
      run: |
        if (Test-Path "dist/paraxcel.exe") {
            Write-Host "paraxcel.exe exists"
        } else {
            Write-Host "paraxcel.exe does not exist"
            exit 1
        }

    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: paraxcel-executable
        path: dist/paraxcel.exe

  release:
    runs-on: ubuntu-latest
    needs: build-executable

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create a Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v1.0.${{ github.run_number }}
        release_name: "Release v1.0.${{ github.run_number }}"
        draft: false
        prerelease: false

    - name: Set Release ID and Upload URL to Environment File
      run: |
        echo "RELEASE_ID=${{ steps.create_release.outputs.id }}" >> $GITHUB_ENV
        echo "UPLOAD_URL=${{ steps.create_release.outputs.upload_url }}" >> $GITHUB_ENV

    - name: Download executable artifact
      uses: actions/download-artifact@v4
      with:
        name: paraxcel-executable
        path: dist/

    - name: Display structure of downloaded files
      run: ls -R dist/

    - name: Upload .exe to Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ env.UPLOAD_URL }}
        asset_path: dist/paraxcel.exe
        asset_name: paraxcel.exe
        asset_content_type: application/octet-stream
